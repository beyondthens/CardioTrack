name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build || true

      - name: Package CardioTrack Android APK
        run: |
          python3 scripts/build-apk.py
          mkdir -p build/outputs/apk/release
          cp public/cardiotrack-za.apk build/outputs/apk/release/cardiotrack-za-v1.2.0.apk
          echo "APK build finished successfully"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardiotrack-za-apk
          path: build/outputs/apk/release/*.apk
          retention-days: 30
